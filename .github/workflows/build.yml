name: Build Casper Server Suite V5

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "admin-security-suite-kick-handshake-source.zip"
      - "classes-v1.2.0-admin-selfchange-source.zip"
      - "mob-radius-fixed-source.zip"
      - "companion-mod-v1.1.6-ui-commands-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Verify V5 source ZIPs exist
        shell: bash
        run: |
          set -euxo pipefail
          test -f admin-security-suite-kick-handshake-source.zip
          test -f classes-v1.2.0-admin-selfchange-source.zip
          test -f mob-radius-fixed-source.zip
          test -f companion-mod-v1.1.6-ui-commands-source.zip

      - name: Extract V5 source projects
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf admin-security-suite classes mob-radius companion-mod dist
          unzip -q admin-security-suite-kick-handshake-source.zip
          unzip -q classes-v1.2.0-admin-selfchange-source.zip
          unzip -q mob-radius-fixed-source.zip
          unzip -q companion-mod-v1.1.6-ui-commands-source.zip
          echo "Extracted project folders:"
          ls -lah

      - name: Build Admin Security Suite
        run: gradle -p admin-security-suite clean build --stacktrace

      - name: Build Classes 1.2.0
        run: gradle -p classes clean build --stacktrace

      - name: Build Mob Radius
        run: gradle -p mob-radius clean build --stacktrace

      - name: Build Fabric Companion 1.1.6
        run: gradle -p companion-mod clean build --stacktrace

      - name: Collect final JARs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          find admin-security-suite/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} dist/ \;

          find classes/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} dist/ \;

          find mob-radius/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} dist/ \;

          find companion-mod/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} dist/ \;

          echo "Final V5 JARs:"
          ls -lah dist

          JAR_COUNT=$(find dist -maxdepth 1 -type f -name "*.jar" | wc -l)
          echo "JAR count: $JAR_COUNT"
          test "$JAR_COUNT" -eq 4

      - name: Upload V5 JAR bundle
        uses: actions/upload-artifact@v4
        with:
          name: casper-server-suite-v5-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
