name: Build Casper Server Suite

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "admin-security-suite-fixed-source.zip"
      - "classes-fixed-source.zip"
      - "mob-radius-fixed-source.zip"
      - "companion-mod-fixed-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Extract corrected source projects
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf admin-security-suite classes mob-radius companion-mod
          unzip -q admin-security-suite-fixed-source.zip
          unzip -q classes-fixed-source.zip
          unzip -q mob-radius-fixed-source.zip
          unzip -q companion-mod-fixed-source.zip

      - name: Build Admin Security Suite
        run: gradle -p admin-security-suite clean build --stacktrace

      - name: Build Classes
        run: gradle -p classes clean build --stacktrace

      - name: Build Mob Radius
        run: gradle -p mob-radius clean build --stacktrace

      - name: Build Fabric Companion
        run: gradle -p companion-mod clean build --stacktrace

      - name: Collect final JARs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          cp admin-security-suite/build/libs/*.jar dist/
          cp classes/build/libs/*.jar dist/
          cp mob-radius/build/libs/*.jar dist/

          # Fabric Loom's normal build output is the remapped production JAR.
          # Ignore dev/source jars if a future build starts producing them.
          find companion-mod/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            -exec cp {} dist/ \;

          echo "Built files:"
          ls -lah dist

      - name: Upload all four JARs
        uses: actions/upload-artifact@v4
        with:
          name: casper-server-suite-jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
